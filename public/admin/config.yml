backend:
  name: github
  repo: Thudeptrai02/learn-lab-web02
  branch: main
  app_id: "Ov23lidr9PjEglH0yyUO"

media_folder: "public/images"
public_folder: "/images"

collections:
  # ----------------------------------------
  # 1. QUẢN LÝ BLOG
  # ----------------------------------------
  - name: "blog"
    label: "Bài viết Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề bài viết", name: "title", widget: "string"}
      - {label: "Tóm tắt (SEO)", name: "description", widget: "string"}
      - {label: "Tác giả", name: "author", widget: "string", required: false, default: "Learn Lab Edu"}
      - label: "Thẻ (Tags)"
        name: "tags"
        widget: "list"
        field: {label: "Thẻ", name: "tag", widget: "string"}
        required: false
      
      # 🚀 ĐÃ CẬP NHẬT 4 CHUYÊN MỤC CHUẨN THEO Ý SẾP
      - label: "Chuyên mục"
        name: "category"
        widget: "select"
        options: ["Trải nghiệm", "Kiến thức", "Niềm tin", "Tài liệu"]
        default: "Kiến thức"
      
      - {label: "Ngày đăng", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Ảnh bìa", name: "image", widget: "image", required: false}
      
      - label: "Loại bài viết"
        name: "writingType"
        widget: "select"
        options:
          - {label: "Bài viết này được viết bởi Admin 🧑‍💻", value: "admin"}
          - {label: "Bài viết này có sự hỗ trợ của AI 🤖", value: "ai-assisted"}
        default: "admin"

      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"

  # ----------------------------------------
  # 2. QUẢN LÝ FLASHCARDS
  # ----------------------------------------
  - name: "flashcards"
    label: "Bộ Từ Vựng (Flashcards)"
    folder: "src/content/flashcards"
    create: true
    extension: "json" 
    format: "json"
    fields:
      - {label: "Tên chủ đề", name: "title", widget: "string"}
      - {label: "Mô tả", name: "description", widget: "string", required: false}
      - label: "Danh sách từ vựng"
        name: "words"
        widget: "list" 
        fields:
          - {label: "Từ vựng (Tiếng Anh)", name: "word", widget: "string"}
          - {label: "Nghĩa (Tiếng Việt)", name: "meaning", widget: "string"}
          - {label: "Phiên âm", name: "phonetic", widget: "string", required: false}
          - {label: "Ví dụ minh họa", name: "example", widget: "text", required: false}
          - {label: "File phát âm (Audio)", name: "audio", widget: "file", required: false}

  # ----------------------------------------
  # 3. QUẢN LÝ DICTATION
  # ----------------------------------------
  - name: "dictation"
    label: "Bài tập Dictation"
    folder: "src/content/dictation"
    create: true
    extension: "json"
    format: "json"
    fields:
      - {label: "Tên bài nghe", name: "title", widget: "string"}
      - {label: "Độ khó", name: "level", widget: "select", options: ["Dễ", "Trung bình", "Khó"]}
      - {label: "File Audio toàn bài", name: "audio", widget: "file"}
      - {label: "Đoạn văn gốc (Transcript)", name: "transcript", widget: "text"}
      - {label: "Bản dịch tiếng Việt", name: "translation", widget: "text", required: false}