backend:
  name: github
  repo: Thudeptrai02/learn-lab-web02
  branch: main
  app_id: "Ov23lidr9PjEglH0yyUO" # <--- Chìa khóa thông hành để đăng nhập

media_folder: "public/images"
public_folder: "/images"

collections:
# ----------------------------------------
  # 1. QUẢN LÝ BLOG (Viết bài chia sẻ)
  # ----------------------------------------
  - name: "blog"
    label: "Bài viết Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề bài viết", name: "title", widget: "string", hint: "Nên viết hoa chữ cái đầu, khoảng 50-70 ký tự."}
      - {label: "Tóm tắt (SEO)", name: "description", widget: "text", hint: "Đoạn giới thiệu ngắn để hiển thị trên Google và trang chủ."}
      - {label: "Ngày đăng", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", hint: "Mặc định hệ thống sẽ lấy ngày hôm nay nếu sếp để trống."}
      - {label: "Ảnh bìa", name: "image", widget: "image", required: false, hint: "Nên dùng ảnh tỷ lệ 16:9 (Ví dụ: 1200x675 px) cho đẹp."}
      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"
        hint: "Gõ vào đây. Bôi đen chữ để hiện menu in đậm, in nghiêng..."
        default: |
          *(Viết 1-2 câu tóm tắt ý chính của bài học vào đây...)*

          ## 1. Đặt vấn đề
          Trong quá trình giảng dạy, thầy nhận thấy rất nhiều bạn sinh viên gặp khó khăn với...

          ## 2. Kiến thức trọng tâm
          Để giải quyết vấn đề này, các em cần nắm vững 3 quy tắc sau:
          1. Quy tắc thứ nhất...
          2. Quy tắc thứ hai...

          > 💡 **Mẹo nhỏ:** Hãy sử dụng Flashcard trên hệ thống Learn Lab để ghi nhớ từ vựng nhanh hơn!

          ## 3. Bài tập thực hành
          - [ ] Hoàn thành bài Dictation Unit 1.
          - [ ] Đọc thêm tài liệu đính kèm.

          ---
          *Chúc các em học tốt và đạt điểm cao!*

  # ----------------------------------------
  # 2. QUẢN LÝ FLASHCARDS (Từ vựng)
  # ----------------------------------------
  - name: "flashcards"
    label: "Bộ Từ Vựng (Flashcards)"
    folder: "src/content/flashcards"
    create: true
    extension: "json" 
    format: "json"
    fields:
      - {label: "Tên chủ đề (VD: Từ vựng TOEIC Part 1)", name: "title", widget: "string"}
      - {label: "Mô tả", name: "description", widget: "string", required: false}
      - label: "Danh sách từ vựng"
        name: "words"
        widget: "list" 
        fields:
          - {label: "Từ vựng (Tiếng Anh)", name: "word", widget: "string"}
          - {label: "Nghĩa (Tiếng Việt)", name: "meaning", widget: "string"}
          - {label: "Phiên âm", name: "phonetic", widget: "string", required: false}
          - {label: "Ví dụ minh họa", name: "example", widget: "text", required: false}
          - {label: "File phát âm (Audio)", name: "audio", widget: "file", required: false}

  # ----------------------------------------
  # 3. QUẢN LÝ DICTATION (Nghe chép chính tả)
  # ----------------------------------------
  - name: "dictation"
    label: "Bài tập Dictation"
    folder: "src/content/dictation"
    create: true
    extension: "json"
    format: "json"
    fields:
      - {label: "Tên bài nghe", name: "title", widget: "string"}
      - {label: "Độ khó", name: "level", widget: "select", options: ["Dễ", "Trung bình", "Khó"]}
      - {label: "File Audio toàn bài", name: "audio", widget: "file"}
      - {label: "Đoạn văn gốc (Transcript)", name: "transcript", widget: "text", hint: "Văn bản chuẩn để đối chiếu kết quả"}
      - {label: "Bản dịch tiếng Việt", name: "translation", widget: "text", required: false}